<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old Coin Buyer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:#fff;
}

.hero{
  padding:50px 20px;
  text-align:center;
  background:#111;
}

.hero h1{
  color:#ffd700;
  font-size:36px;
  margin-bottom:15px;
}

.hero p{
  color:#ddd;
  font-size:17px;
  line-height:1.6;
}

section{
  padding:30px 18px;
  max-width:650px;
  margin:auto;
}

h2{
  color:#ffd700;
  text-align:center;
  margin-bottom:25px;
}

form{
  background:#222;
  padding:25px;
  border-radius:15px;
  border:1px solid #444;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:8px;
  font-size:17px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:1px solid #777;
  background:#111;
  color:#fff;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input[type="file"]{
  padding:11px;
}

.help{
  margin-top:10px;
  color:#bbb;
  font-size:14px;
  line-height:1.5;
}

.btn{
  width:100%;
  margin-top:25px;
  padding:16px;
  background:#ffd700;
  color:#111;
  border:none;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.btn:active{
  transform:scale(.98);
}

footer{
  text-align:center;
  padding:25px;
  color:#888;
}
</style>
</head>

<body>

<div class="hero">

  <h1>Sell Your Coin / Note</h1>

  <p>
    Submit your details and a clear photo
    of your old coin or currency note.
  </p>

</div>


<section>

  <h2>Submit Your Coin / Note</h2>

  <form onsubmit="sendWhatsApp(event)">

    <!-- SELLER NAME -->
    <label for="name">
      Seller Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Enter seller name"
      required
    >


    <!-- SELLER ADDRESS -->
    <label for="address">
      Seller Address
    </label>

    <textarea
      id="address"
      placeholder="Enter seller full address"
      required
    ></textarea>


    <!-- MOBILE NUMBER -->
    <label for="phone">
      Mobile Number
    </label>

    <input
      type="tel"
      id="phone"
      placeholder="Enter mobile number"
      inputmode="numeric"
      required
    >


    <!-- COIN / NOTE PHOTO -->
    <label for="photo">
      Coin / Note Photo
    </label>

    <input
      type="file"
      id="photo"
      accept="image/*"
      required
    >

    <div class="help">
      Select a clear photo of your coin or currency note.
      Your selected photo will be shared with the details.
    </div>


    <!-- SUBMIT -->
    <button
      type="submit"
      class="btn"
    >
      📱 Send Details & Photo on WhatsApp
    </button>

  </form>

</section>


<footer>
  © 2026 Old Coin Buyer
</footer>


<script>

async function sendWhatsApp(event){

  event.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const photoInput =
    document.getElementById("photo");

  const photo =
    photoInput.files[0];


  /* CHECK ALL FOUR OPTIONS */

  if(!name || !address || !phone || !photo){

    alert(
      "Please fill Seller Name, Address, Mobile Number and select a photo."
    );

    return;
  }


  /* WHATSAPP MESSAGE */

  const message =
    "Hello Old Coin Buyer,\n\n" +

    "New Coin / Note Submission\n\n" +

    "Seller Name: " + name + "\n" +

    "Seller Address: " + address + "\n" +

    "Mobile Number: " + phone + "\n\n" +

    "Coin / Note Photo is attached.";


  /*
    MOBILE SHARE SYSTEM

    The selected photo will be included
    as an attachment when WhatsApp is selected.
  */

  try{

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:[photo]
      })
    ){

      await navigator.share({

        title:"Old Coin Buyer",

        text:message,

        files:[photo]

      });

      return;
    }


    /*
      FALLBACK:
      If the browser does not support
      photo sharing, open WhatsApp
      with the text.
    */

    const encodedMessage =
      encodeURIComponent(message);

    window.location.href =
      "https://wa.me/919785469805?text=" +
      encodedMessage;

  }

  catch(error){

    /*
      If user cancels the share window,
      do nothing.
    */

    if(error.name !== "AbortError"){

      alert(
        "Photo sharing is not supported by this browser. Please try Chrome or Safari on your phone."
      );

    }

  }

}

</script>

</body>
</html>
